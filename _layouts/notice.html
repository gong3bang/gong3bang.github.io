---
layout: default
---
<article class="post notice-post">
  <header class="post-header">
    <p class="post-meta">
      <span class="meta-cat">공방공지</span>
      {%- if page.date -%}<time class="meta-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y. %-m. %-d." }}</time>{%- endif -%}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="body">
    {{ content }}
  </div>
</article>
