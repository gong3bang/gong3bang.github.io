name: 블로그·깃허브 가져오기

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공공부 — 네이버 블로그 RSS
        run: python3 scripts/fetch_naver.py "https://rss.blog.naver.com/gong3bang.xml"

      - name: 공공공구 — GitHub 공개 저장소
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github.py gong3bang

      - name: 바뀐 것이 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain _posts _works)" ]; then
            git config user.name "공삼"
            git config user.email "331262403+gong3bang@users.noreply.github.com"
            git add _posts _works
            git commit -m "공공공부·공공공구: 새 글과 저장소 가져옴"
            git push
          else
            echo "새로 가져올 것이 없습니다."
          fi
