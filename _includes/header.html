<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="공공공방 첫 화면">
      {% include mark.svg %}
      <span class="brand-name">공공공방</span>
    </a>
    <nav class="site-nav" aria-label="주 메뉴">
      {% for item in site.data.nav %}<a href="{{ item.url | relative_url }}">{% if item.mark %}<span class="mark">{{ item.mark }}</span>{% endif %}{{ item.label }}</a>{% endfor %}
    </nav>
  </div>
</header>
